<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette Wheel</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        .roulette-wheel {
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                #ff6b6b 0deg 12deg,
                #4ecdc4 12deg 24deg,
                #95e1d3 24deg 36deg,
                #f38181 36deg 48deg,
                #aa96da 48deg 60deg,
                #fcbad3 60deg 72deg,
                #ffffd2 72deg 84deg,
                #a8d8ea 84deg 96deg,
                #aa96da 96deg 108deg,
                #feca57 108deg 120deg,
                #ff9ff3 120deg 132deg,
                #54a0ff 132deg 144deg,
                #48dbfb 144deg 156deg,
                #1dd1a1 156deg 168deg,
                #10ac84 168deg 180deg,
                #ee5a6f 180deg 192deg,
                #f8b500 192deg 204deg,
                #ff6348 204deg 216deg,
                #ff4757 216deg 228deg,
                #ffa502 228deg 240deg,
                #ff6a88 240deg 252deg,
                #c44569 252deg 264deg,
                #f8049c 264deg 276deg,
                #1e90ff 276deg 288deg,
                #00d2d3 288deg 300deg,
                #0a8aff 300deg 312deg,
                #a29bfe 312deg 324deg,
                #fd79a8 324deg 336deg,
                #fdcb6e 336deg 348deg,
                #6c5ce7 348deg 360deg
            );
            border: 8px solid #333;
            cursor: pointer;
            position: relative;
            transition: transform 0.1s ease-out;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
        }

        .roulette-wheel.spinning {
            animation: spin 3s linear forwards;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(1800deg);
            }
        }

        .roulette-wheel::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: #333;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #333;
            z-index: 5;
        }

        .numbers-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 0 auto;
        }

        .number {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: #333;
        }

        h1 {
            color: white;
            margin-bottom: 40px;
        }

        .result {
            color: white;
            font-size: 24px;
            margin-top: 40px;
            min-height: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Roulette Wheel</h1>
        <div style="position: relative; display: inline-block;">
            <div class="pointer"></div>
            <div class="roulette-wheel" id="wheel"></div>
        </div>
        <div class="result" id="result"></div>
    </div>

    <script>
        const wheel = document.getElementById('wheel');
        const resultDiv = document.getElementById('result');
        let isSpinning = false;

        // Generate numbers on the wheel
        function initializeWheel() {
            for (let i = 1; i <= 30; i++) {
                const number = document.createElement('div');
                number.textContent = i;
                number.style.position = 'absolute';
                number.style.width = '100%';
                number.style.height = '100%';
                number.style.display = 'flex';
                number.style.alignItems = 'flex-start';
                number.style.justifyContent = 'center';
                number.style.paddingTop = '15px';
                number.style.fontWeight = 'bold';
                number.style.fontSize = '16px';
                number.style.color = 'white';
                number.style.textShadow = '2px 2px 4px rgba(0, 0, 0, 0.5)';
                number.style.transform = `rotate(${(i - 1) * 12}deg)`;
                wheel.appendChild(number);
            }
        }

        initializeWheel();
        wheel.addEventListener('click', spinRoulette);

        function spinRoulette() {
            if (isSpinning) return;

            isSpinning = true;
            resultDiv.textContent = '';

            // Random rotation (multiple of 360 for full spins + random offset to land on a number)
            const randomNumber = Math.floor(Math.random() * 30) + 1;
            const segmentAngle = 360 / 30;
            const randomRotation = Math.random() * 360 + (5 * 360); // 5 full rotations + random offset

            // Add spinning class for animation
            wheel.classList.add('spinning');

            // Calculate the final rotation
            const finalRotation = randomRotation - ((randomNumber - 1) * segmentAngle);

            setTimeout(() => {
                wheel.classList.remove('spinning');
                wheel.style.transform = `rotate(${finalRotation}deg)`;
                isSpinning = false;
                resultDiv.textContent = `You landed on: ${randomNumber}`;
            }, 3000);
        }
    </script>
</body>
</html>
