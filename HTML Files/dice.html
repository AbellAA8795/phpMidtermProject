<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette Wheel</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
        }

        .roulette-wheel {
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: conic-gradient(
                from 270deg,
                #ff0000 0deg 12deg,
                #000000 12deg 24deg,
                #ff0000 24deg 36deg,
                #000000 36deg 48deg,
                #ff0000 48deg 60deg,
                #000000 60deg 72deg,
                #ff0000 72deg 84deg,
                #000000 84deg 96deg,
                #ff0000 96deg 108deg,
                #000000 108deg 120deg,
                #ff0000 120deg 132deg,
                #000000 132deg 144deg,
                #ff0000 144deg 156deg,
                #000000 156deg 168deg,
                #ff0000 168deg 180deg,
                #000000 180deg 192deg,
                #ff0000 192deg 204deg,
                #000000 204deg 216deg,
                #ff0000 216deg 228deg,
                #000000 228deg 240deg,
                #ff0000 240deg 252deg,
                #000000 252deg 264deg,
                #ff0000 264deg 276deg,
                #000000 276deg 288deg,
                #ff0000 288deg 300deg,
                #000000 300deg 312deg,
                #ff0000 312deg 324deg,
                #000000 324deg 336deg,
                #ff0000 336deg 348deg,
                #000000 348deg 360deg
            );
            border: 8px solid #333;
            cursor: pointer;
            position: relative;
            transition: transform 0.1s ease-out;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
        }

        .roulette-wheel.spinning {
            animation: spin 3s linear forwards;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(1800deg);
            }
        }

        .roulette-wheel::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: #333;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #333;
            z-index: 5;
        }

        .numbers-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 0 auto;
        }

        .number {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: #333;
        }

        h1 {
            color: white;
            margin-bottom: 40px;
        }

        .result {
            color: white;
            font-size: 24px;
            margin-top: 40px;
            min-height: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Roulette Wheel</h1>
        <div style="position: relative; display: inline-block;">
            <div class="pointer"></div>
            <div class="roulette-wheel" id="wheel"></div>
        </div>
        <div class="result" id="result"></div>
    </div>

    <script>
        const wheel = document.getElementById('wheel');
        const resultDiv = document.getElementById('result');
        let isSpinning = false;

        function initializeWheel() {
            for (let i = 1; i <= 30; i++) {
                const angle = (i - 1) * 12; // 12 degrees per number
                const radians = (angle - 90) * Math.PI / 180;
                
                const radius = 185; // Closer to the edge for better alignment with arrow
                const x = 200 + radius * Math.cos(radians);
                const y = 200 + radius * Math.sin(radians);
                
                const number = document.createElement('div');
                number.textContent = i;
                number.style.position = 'absolute';
                number.style.left = x + 'px';
                number.style.top = y + 'px';
                number.style.width = '35px';
                number.style.height = '35px';
                number.style.marginLeft = '-17.5px';
                number.style.marginTop = '-17.5px';
                number.style.display = 'flex';
                number.style.alignItems = 'center';
                number.style.justifyContent = 'center';
                number.style.fontSize = '16px';
                number.style.fontWeight = 'bold';
                number.style.color = 'white';
                number.style.textShadow = '3px 3px 6px rgba(0, 0, 0, 0.9)';
                
                wheel.appendChild(number);
            }
        }

        initializeWheel();
        wheel.addEventListener('click', spinRoulette);

        function spinRoulette() {
            if (isSpinning) return;
            
            isSpinning = true;
            resultDiv.textContent = '';

            const winningNumber = Math.floor(Math.random() * 30) + 1;
            const rotationsNeeded = winningNumber === 1 ? 0 : (30 - winningNumber + 1);
            const segmentAngle = 12; // 360 / 30
            const totalRotation = 5 * 360 + rotationsNeeded * segmentAngle;

            wheel.classList.add('spinning');

            setTimeout(() => {
                wheel.classList.remove('spinning');
                wheel.style.transform = `rotate(${totalRotation}deg)`;
                
                isSpinning = false;
                resultDiv.textContent = `You landed on: ${winningNumber}`;
            }, 3000);
        }
    </script>
</body>
</html>
